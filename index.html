<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>主設備排程甘特圖｜鴻睿自動化</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* ======================= 設定區（只要改這裡） ======================= */
/* API 網址與 LOGO 在下方程式碼的 CONFIG 裡 */
:root{
  --brand:#1f3a5f; --brand-2:#2c5282; --accent:#e67e22; --bg:#f4f6f9; --card:#ffffff;
  --line:#dfe4ea; --line-2:#eef1f5; --text:#1d2733; --muted:#6b7785; --danger:#c0392b;
  --today:#e53935; --hol:#fde7d3; --hol-text:#c0560c; --row-h:30px; --left-w:600px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:'Noto Sans TC',system-ui,-apple-system,'Microsoft JhengHei',sans-serif;background:var(--bg);color:var(--text);font-size:14px;display:flex;flex-direction:column}
button,input,select,textarea{font:inherit}
/* 頁首 */
header{background:var(--brand);color:#fff;display:flex;align-items:center;gap:12px;padding:10px 16px;flex-wrap:wrap}
.logo{width:56px;height:44px;border-radius:8px;background:#fff;padding:3px;color:var(--brand);font-weight:700;display:flex;align-items:center;justify-content:center;font-size:16px;overflow:hidden;flex:none}
.logo img{width:100%;height:100%;object-fit:contain}
.ttl h1{margin:0;font-size:18px;font-weight:700}
.ttl small{opacity:.8;font-size:12px}
header .sp{flex:1}
.hbtn{background:rgba(255,255,255,.14);color:#fff;border:1px solid rgba(255,255,255,.3);border-radius:8px;padding:6px 12px;cursor:pointer;white-space:nowrap}
.hbtn:hover{background:rgba(255,255,255,.25)}
.hbtn.on{background:var(--accent);border-color:var(--accent)}
/* 工具列 */
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 16px;background:var(--card);border-bottom:1px solid var(--line)}
.toolbar input,.toolbar select{border:1px solid var(--line);border-radius:8px;padding:6px 10px;background:#fff;min-width:0}
.toolbar input[type=search]{width:200px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:#fff;padding:6px 12px;cursor:pointer}
.seg button.on{background:var(--brand);color:#fff}
.btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 12px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--brand-2)}
.btn.pri{background:var(--brand);color:#fff;border-color:var(--brand)}
.btn.warn{background:var(--danger);color:#fff;border-color:var(--danger)}
.count{color:var(--muted);font-size:13px}
.banner{background:#fff6d6;color:#7a5b00;padding:6px 16px;font-size:13px;border-bottom:1px solid #f0e2a8;display:none}
.banner.err{background:#fde2e1;color:#8a1f17;border-color:#f3b9b5}
/* 甘特圖本體 */
.wrap{flex:1;min-height:0;padding:12px 16px 16px;display:flex;flex-direction:column}
.gantt{flex:1;min-height:0;overflow:auto;background:var(--card);border:1px solid var(--line);border-radius:10px;position:relative}
.ginner{position:relative}
.ghead{position:sticky;top:0;z-index:5;display:flex;background:#f8fafc;border-bottom:1px solid var(--line)}
.lhead{position:sticky;left:0;z-index:6;width:var(--left-w);flex:none;display:flex;align-items:flex-end;background:#eef2f7;border-right:2px solid var(--line);font-weight:700;font-size:13px}
.lhead div,.lrow div{padding:0 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tl-head{position:relative;flex:none}
.tier{position:relative;height:24px;border-bottom:1px solid var(--line-2)}
.tier div{position:absolute;top:0;height:100%;border-left:1px solid var(--line);font-size:12px;display:flex;align-items:center;justify-content:center;color:var(--muted);overflow:hidden;white-space:nowrap}
.tier.y div{font-weight:700;color:var(--text);justify-content:flex-start;padding-left:6px}
.tier div.hol{background:var(--hol);color:var(--hol-text);font-weight:700}
.tier div.cur{background:#e3ecf8;color:var(--brand);font-weight:700}
.c-no{width:40px;text-align:center}.c-wo{width:62px}.c-cu{width:64px}.c-si{width:58px}.c-eq{flex:1}.c-sh{width:96px}.c-fi{width:96px}
.rows{position:relative}
.grid{position:absolute;top:0;bottom:0;pointer-events:none}
.grid div{position:absolute;top:0;bottom:0;border-left:1px solid var(--line-2)}
.grid div.yr{border-left:1px solid #c9d2dd}
.grid div.hol{background:rgba(253,231,211,.55)}
.today{position:absolute;top:0;bottom:0;width:2px;background:var(--today);z-index:3;pointer-events:none}
.today span{position:absolute;top:2px;left:4px;background:var(--today);color:#fff;font-size:11px;padding:0 4px;border-radius:3px;white-space:nowrap}
.row{display:flex;height:var(--row-h);border-bottom:1px solid var(--line-2);cursor:pointer}
.row:hover .lrow,.row:hover .tl{background:#f3f7fd}
.lrow{position:sticky;left:0;z-index:4;width:var(--left-w);flex:none;display:flex;align-items:center;background:#fff;border-right:2px solid var(--line);font-size:13px}
.lrow .c-sh,.lrow .c-fi{font-variant-numeric:tabular-nums;color:#3b4652}
.row.past .lrow{color:#9aa4b0}
.tl{position:relative;flex:none}
.bar{position:absolute;top:5px;height:calc(var(--row-h) - 10px);border-radius:5px;color:#fff;font-size:11px;line-height:calc(var(--row-h) - 10px);padding:0 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;z-index:2;box-shadow:0 1px 2px rgba(0,0,0,.15)}
.bar.bad{background:repeating-linear-gradient(45deg,#c0392b,#c0392b 6px,#e57368 6px,#e57368 12px)!important}
.row.past .bar{opacity:.45}
.empty{padding:40px;text-align:center;color:var(--muted)}
.legend{display:flex;flex-wrap:wrap;gap:10px;padding:8px 2px 0;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-2px;margin-right:4px}
/* 提示框 */
#tip{position:fixed;z-index:50;background:#1d2733;color:#fff;font-size:12px;padding:8px 10px;border-radius:8px;pointer-events:none;display:none;max-width:280px;line-height:1.6}
/* 彈窗 */
.mask{position:fixed;inset:0;background:rgba(15,23,32,.45);z-index:60;display:none;align-items:center;justify-content:center;padding:16px}
.mask.show{display:flex}
.dlg{background:#fff;border-radius:12px;width:100%;max-width:560px;max-height:90vh;overflow:auto;box-shadow:0 10px 40px rgba(0,0,0,.25)}
.dlg h2{margin:0;padding:14px 18px;font-size:16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px}
.dlg h2 .x{margin-left:auto;border:0;background:none;font-size:20px;cursor:pointer;color:var(--muted)}
.dlg .bd{padding:16px 18px}
.dlg .ft{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.kv{display:grid;grid-template-columns:96px 1fr;gap:6px 10px;font-size:14px}
.kv b{color:var(--muted);font-weight:500}
.note{white-space:pre-wrap;background:#f8fafc;border:1px solid var(--line-2);border-radius:8px;padding:8px 10px;min-height:20px}
.form{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.form label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
.form label.full{grid-column:1/-1}
.form input,.form textarea{border:1px solid var(--line);border-radius:8px;padding:7px 10px;color:var(--text)}
.form textarea{min-height:70px;resize:vertical}
.req{color:var(--danger)}
.bar .h{display:none;position:absolute;top:0;bottom:0;width:8px;cursor:ew-resize;background:rgba(255,255,255,.35)}
.bar .h.l{left:0;border-radius:5px 0 0 5px}.bar .h.r{right:0;border-radius:0 5px 5px 0}
body.admin .bar{cursor:grab;touch-action:none}
body.admin .bar:hover .h{display:block}
body.admin .bar.drag{cursor:grabbing;opacity:1!important;outline:2px solid #1d2733;z-index:6}
body.admin .bar.drag .h{display:block}
.row.moved .lrow .c-sh,.row.moved .lrow .c-fi{color:var(--accent);font-weight:700}
.toast button{margin-left:12px;background:var(--accent);color:#fff;border:0;border-radius:999px;padding:3px 12px;cursor:pointer}
.msg{font-size:13px;color:var(--danger);margin-top:8px;min-height:18px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#1d2733;color:#fff;padding:10px 18px;border-radius:999px;z-index:80;display:none;font-size:14px}
.loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--muted);background:rgba(255,255,255,.7);z-index:20}
.adminonly{display:none}
body.admin .adminonly{display:inline-block}
/* 列印專用 */
.print-head,.print-foot,.wm{display:none}
@media (max-width:760px){
  :root{--left-w:250px}
  .c-no,.c-si,.c-sh,.c-fi{display:none}
  .toolbar input[type=search]{width:100%}
  .ttl h1{font-size:16px}
  .form{grid-template-columns:1fr}
}
@media print{
  @page{size:A3 landscape;margin:10mm}
  body{background:#fff;display:block;height:auto}
  header,.toolbar,.banner,.legend .noprint,#tip,.toast{display:none!important}
  .wrap{padding:0;display:block}
  .gantt{overflow:visible;border:0;border-radius:0}
  .ghead,.lhead,.lrow{position:static}
  .print-head{display:flex;align-items:center;gap:12px;margin-bottom:8px;border-bottom:2px solid var(--brand);padding-bottom:6px}
  .print-head .logo{border:1px solid var(--brand)}
  .print-head h1{margin:0;font-size:18px}
  .print-head .r{margin-left:auto;font-size:12px;color:var(--muted);text-align:right}
  .print-foot{display:block;position:fixed;bottom:0;left:0;right:0;text-align:center;font-size:10px;color:#888}
  .wm{display:block;position:fixed;inset:0;z-index:30;pointer-events:none;overflow:hidden}
  .wm span{position:absolute;font-size:46px;font-weight:700;color:rgba(31,58,95,.07);transform:rotate(-28deg);white-space:nowrap}
  .row{break-inside:avoid}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>
<body>

<header>
  <div class="logo" id="logo">HR</div>
  <div class="ttl"><h1>主設備排程｜總覽甘特圖</h1><small>鴻睿自動化股份有限公司　HR</small></div>
  <div class="sp"></div>
  <button class="hbtn" id="btnAdmin">🔒 管理員登入</button>
</header>

<div class="banner" id="banner"></div>

<div class="toolbar">
  <input type="search" id="q" placeholder="🔍 搜尋工令、客戶、設備、備註">
  <select id="fCu"><option value="">全部客戶</option></select>
  <select id="fSi"><option value="">全部廠別</option></select>
  <select id="fYr"><option value="">全部年度</option></select>
  <div class="seg" id="scale"><button data-v="m" class="on">月</button><button data-v="w">週</button></div>
  <button class="btn" id="btnToday">📍 跳到今天</button>
  <span class="count" id="count"></span>
  <span style="flex:1"></span>
  <button class="btn pri adminonly" id="btnAdd">＋ 新增排程</button>
  <button class="btn" id="btnXlsx">⬇ 匯出 Excel</button>
  <button class="btn" id="btnPrint">🖨 列印</button>
  <button class="btn" id="btnReload" title="重新抓取最新資料">⟳</button>
</div>

<div class="wrap">
  <div class="print-head">
    <div class="logo" id="logoP">HR</div>
    <div><h1>鴻睿自動化股份有限公司　主設備排程甘特圖</h1><div style="font-size:12px" id="pFilter"></div></div>
    <div class="r">列印日期：<span id="pDate"></span><br>生管課</div>
  </div>
  <div class="gantt" id="gantt"><div class="loading" id="loading">資料載入中…</div></div>
  <div class="legend" id="legend"></div>
  <div class="print-foot">鴻睿自動化股份有限公司 內部文件・未經同意請勿外流</div>
  <div class="wm" id="wm"></div>
</div>

<!-- 詳細資料 / 編輯 彈窗 -->
<div class="mask" id="mDlg"><div class="dlg" id="dlg"></div></div>
<div id="tip"></div>
<div class="toast" id="toast"></div>

/* ---------- 日期工具（全部用 UTC 的「天數」計算，避免時區誤差） ---------- */
const dn = s => { if(!s) return NaN; const [y,m,d] = s.split('-').map(Number); return Date.UTC(y,m-1,d)/DAY; };
const ds = n => new Date(n*DAY).toISOString().slice(0,10);
const todayStr = () => { const t = new Date(); return `${t.getFullYear()}-${String(t.getMonth()+1).padStart(2,'0')}-${String(t.getDate()).padStart(2,'0')}`; };
const fmt = s => s ? s.replace(/-/g,'/') : '';
const daysInMonth = (y,m) => new Date(Date.UTC(y,m+1,0)).getUTCDate();

/* ---------- 資料存取 ---------- */
async function api(action, payload){
  if (DEMO) return demoApi(action, payload);
  if (action === 'list'){
    const r = await fetch(CONFIG.API_URL + '?t=' + Date.now()); return r.json();
  }
  const r = await fetch(CONFIG.API_URL, {method:'POST', body: JSON.stringify({action, pin:S.pin, ...payload})});
  return r.json();
}

let DEMO_DB = null;
function demoApi(action, p){
  if (!DEMO_DB) DEMO_DB = demoLoad() || {items: JSON.parse(JSON.stringify(SEED))};
  const db = DEMO_DB;
  let res = {ok:true};
  if (action==='list') res = {ok:true, items:db.items, holidays:SEED_HOL};
  else if (S.pin!=='0000') res = {ok:false,error:'管理員密碼錯誤'};
  else if (action==='checkPin') res = {ok:true};
  else if (action==='add'){ const o={...p.item,id:'G'+Date.now()}; if(!o.no) o.no=String(db.items.reduce((m,x)=>Math.max(m,+x.no||0),0)+1); db.items.push(o); res={ok:true,item:o}; }
  else if (action==='update'){ const i=db.items.findIndex(x=>x.id===p.item.id); if(i<0) res={ok:false,error:'找不到這筆資料'}; else db.items[i]={...db.items[i],...p.item}; }
  else if (action==='delete'){ const i=db.items.findIndex(x=>x.id===p.id); if(i>=0) db.items.splice(i,1); }
  demoSave(db);
  return Promise.resolve(JSON.parse(JSON.stringify(res)));
}

  $('#loading') && ($('#loading').style.display='flex');

  }catch(e){
    showBanner('⚠ 讀取資料失敗：' + e.message + '（請檢查網路，或確認 API 網址是否正確）', true);

/* ---------- 篩選 ---------- */
function buildFilters(){
  const uniq = k => [...new Set(S.items.map(x=>x[k]).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'zh-Hant'));
  const fill = (sel, arr, first) => { const v = sel.value; sel.innerHTML = `<option value="">${first}</option>` + arr.map(a=>`<option>${esc(a)}</option>`).join(''); if (arr.includes(v)) sel.value = v; };
  fill($('#fCu'), uniq('customer'), '全部客戶');
  fill($('#fSi'), uniq('site'), '全部廠別');
  const yrs = new Set(); S.items.forEach(x => { const a=+x.ship.slice(0,4), b=+(x.finish||x.ship).slice(0,4); for(let y=a;y<=b;y++) if(y) yrs.add(y); });
  fill($('#fYr'), [...yrs].sort().map(String), '全部年度');
  // 每個客戶固定一個顏色
  uniq('customer').forEach((c,i) => S.colorMap[c] = PALETTE[i % PALETTE.length]);
}
function filtered(){
  const q = $('#q').value.trim().toLowerCase(), cu = $('#fCu').value, si = $('#fSi').value, yr = $('#fYr').value;
  return S.items.filter(x => {
    if (cu && x.customer !== cu) return false;
    if (si && x.site !== si) return false;
    if (yr && !(x.ship.slice(0,4) <= yr && (x.finish||x.ship).slice(0,4) >= yr)) return false;
    if (q && ![x.wo,x.customer,x.site,x.equip,x.note].join(' ').toLowerCase().includes(q)) return false;
    return true;
  }).sort((a,b) => (a.ship||'').localeCompare(b.ship||'') || (a.no||0)-(b.no||0));
}

/* ---------- 時間軸 ---------- */
function makeAxis(list, fitWidth){
  const yr = $('#fYr').value;
  let lo, hi;
  if (yr){ lo = dn(yr+'-01-01'); hi = dn(yr+'-12-31'); }
  else {
    lo = Math.min(...list.map(x=>dn(x.ship)).filter(isFinite), dn(todayStr()));
    hi = Math.max(...list.map(x=>dn(x.finish||x.ship)).filter(isFinite), dn(todayStr()));
  }
  const L = new Date(lo*DAY), H = new Date(hi*DAY);
  const ax = {cols:[], years:[], scale:S.scale};
  if (S.scale === 'm'){
    let y = L.getUTCFullYear(), m = L.getUTCMonth();
    const endY = H.getUTCFullYear(), endM = H.getUTCMonth();
    const n = (endY-y)*12 + (endM-m) + 1;
    const w = fitWidth ? Math.max(14, fitWidth/n) : MON_W;
    for (let i=0;i<n;i++){
      const s = Date.UTC(y,m,1)/DAY, len = daysInMonth(y,m);
      ax.cols.push({x:i*w, w, start:s, end:s+len, label:(m+1)+'月', y, m});
      if (++m === 12){ m=0; y++; }
    }
    ax.width = n*w;
    ax.dayAt = px => { if (px < 0) return ax.cols[0].start + px/w*30; if (px >= ax.width) return ax.cols[n-1].end + (px-ax.width)/w*30; const c = ax.cols[Math.min(n-1, Math.floor(px/w))]; return c.start + (px-c.x)/c.w*(c.end-c.start); };
    ax.pos = d => { const c = ax.cols.find(c => d >= c.start && d < c.end); if (c) return c.x + (d-c.start)/(c.end-c.start)*c.w; return d < ax.cols[0].start ? 0 : ax.width; };
  } else {
    const startMon = lo - ((L.getUTCDay()+6)%7);                 // 往前找到星期一
    const n = Math.ceil((hi - startMon + 1)/7);
    const w = fitWidth ? Math.max(6, fitWidth/n) : WK_W;
    for (let i=0;i<n;i++){
      const s = startMon + i*7, d = new Date(s*DAY);
      ax.cols.push({x:i*w, w, start:s, end:s+7, label: String(d.getUTCDate()), y:d.getUTCFullYear(), m:d.getUTCMonth()});
    }
    ax.width = n*w;
    ax.pos = d => Math.min(ax.width, Math.max(0, (d - startMon)/7*w));
    ax.dayAt = px => startMon + px/w*7;
  }
  // 年度 / 月份 第一層
  let cur = null;
  ax.cols.forEach(c => {
    const key = S.scale==='m' ? c.y : c.y+'-'+c.m;
    if (!cur || cur.key !== key){ cur = {key, x:c.x, w:0, label: S.scale==='m' ? c.y+' 年' : `${c.y}/${c.m+1}`}; ax.years.push(cur); }
    cur.w += c.w;
  });
  // 國定假日落在哪一欄
  const hol = S.holidays.map(h => ({d:dn(h.date), name:h.name})).filter(h => isFinite(h.d));
  ax.cols.forEach(c => { c.hols = hol.filter(h => h.d >= c.start && h.d < c.end); });
  return ax;
}

/* ---------- 畫圖 ---------- */
function render(fitWidth){
  const list = filtered();
  $('#count').textContent = `共 ${list.length} 筆` + (list.length !== S.items.length ? `（全部 ${S.items.length} 筆）` : '');
  const g = $('#gantt');
  if (!list.length){ g.innerHTML = '<div class="empty">沒有符合條件的排程</div>'; $('#legend').innerHTML=''; return; }
  const ax = makeAxis(list, fitWidth);
  const T = dn(todayStr()), todayX = (T >= ax.cols[0].start && T < ax.cols[ax.cols.length-1].end) ? ax.pos(T) : null;
  const curCol = ax.cols.find(c => T >= c.start && T < c.end);

  const tier1 = ax.years.map(y => `<div style="left:${y.x}px;width:${y.w}px">${y.w>40?esc(y.label):''}</div>`).join('');
  const tier2 = ax.cols.map(c => {
    const cls = (c.hols.length && S.scale==='w' ? 'hol' : '') + (c===curCol ? ' cur' : '');
    const tt = c.hols.length ? c.hols.map(h=>ds(h.d).slice(5).replace('-','/')+' '+h.name).join('\n') : '';
    return `<div class="${cls}" style="left:${c.x}px;width:${c.w}px" ${tt?`data-tip="${esc(tt)}"`:''}>${c.w>=14?esc(c.label):''}${S.scale==='m'&&c.hols.length&&c.w>=40?'<span style="color:var(--hol-text);font-size:9px;margin-left:2px">●</span>':''}</div>`;
  }).join('');
  const grid = ax.cols.map((c,i) => {
    const yr = S.scale==='m' ? c.m===0 : (i>0 && ax.cols[i-1].m !== c.m);
    const hol = S.scale==='w' && c.hols.length;
    return `<div class="${yr?'yr':''} ${hol?'hol':''}" style="left:${c.x}px;width:${c.w}px"></div>`;
  }).join('');

  const rows = list.map(x => {
    const s = dn(x.ship), f = dn(x.finish || x.ship);
    const bad = !(f >= s);
    const x1 = ax.pos(bad ? f : s), x2 = ax.pos((bad ? s : f) + 1);
    const col = S.colorMap[x.customer] || PALETTE[0];
    const past = f < T;
    return `<div class="row ${past?'past':''}" data-id="${esc(x.id)}">
      <div class="lrow"><div class="c-no">${esc(x.no)}</div><div class="c-wo">${esc(x.wo)}</div><div class="c-cu">${esc(x.customer)}</div><div class="c-si">${esc(x.site)}</div><div class="c-eq" title="${esc(x.equip)}">${esc(x.equip)}${x.note?' 📝':''}</div><div class="c-sh">${fmt(x.ship)}</div><div class="c-fi">${fmt(x.finish)}</div></div>

      ${rows}

  // 圖例
  const cus = [...new Set(list.map(x=>x.customer))];
  $('#legend').innerHTML = cus.map(c=>`<span><i style="background:${S.colorMap[c]}"></i>${esc(c)}</span>`).join('')
    + `<span><i style="background:var(--today);width:3px"></i>今天</span>`
    + (S.scale==='w'?`<span><i style="background:var(--hol)"></i>國定假日</span>`:`<span><span style="color:var(--hol-text)">●</span> 該月有國定假日（切到「週」可看細節）</span>`)

  S.lastAxis = ax;
}

function scrollToToday(){
  const ax = S.lastAxis; if (!ax) return;
  const T = dn(todayStr());
  const x = ax.pos(T);
  const leftW = parseInt(getComputedStyle(document.documentElement).getPropertyValue('--left-w'));
  $('#gantt').scrollLeft = Math.max(0, x - 120);
  if (!(T >= ax.cols[0].start && T < ax.cols[ax.cols.length-1].end)) toast('今天不在目前篩選的時間範圍內');
}

/* ---------- 拖拉色條（管理員） ---------- */
// 拖中間 = 整條移動；拖左邊緣 = 改出貨日；拖右邊緣 = 改預計完成日
$('#gantt').addEventListener('pointerdown', e => {
  if (!S.admin || e.button > 0) return;
  const bar = e.target.closest('[data-bar]'); if (!bar) return;
  const x = S.items.find(i => i.id === bar.dataset.bar); if (!x) return;
  const s = dn(x.ship), f = dn(x.finish);
  if (!(f >= s)) return toast('這筆日期異常，請點開用「修改」調整');
  e.preventDefault();
  const ax = S.lastAxis;
  S.drag = { bar, x, ax, s, f, ns:s, nf:f, mode: e.target.classList.contains('l') ? 'l' : e.target.classList.contains('r') ? 'r' : 'm',
             sx: e.clientX, x1: ax.pos(s), x2: ax.pos(f+1), moved:false, row: bar.closest('.row') };
  bar.setPointerCapture(e.pointerId);
});
$('#gantt').addEventListener('pointermove', e => {
  const D = S.drag; if (!D) return;
  const dx = e.clientX - D.sx;
  if (!D.moved && Math.abs(dx) < 4) return;
  if (!D.moved){ D.moved = true; D.bar.classList.add('drag'); D.row.classList.add('moved'); }
  const ax = D.ax;
  if (D.mode === 'm'){ const d = Math.round(ax.dayAt(D.x1 + dx)) - D.s; D.ns = D.s + d; D.nf = D.f + d; }
  else if (D.mode === 'l'){ D.ns = Math.min(Math.round(ax.dayAt(D.x1 + dx)), D.f); D.nf = D.f; }
  else { D.nf = Math.max(Math.round(ax.dayAt(D.x2 + dx)) - 1, D.s); D.ns = D.s; }
  const a = ax.pos(D.ns), b = ax.pos(D.nf + 1);
  D.bar.style.left = a + 'px'; D.bar.style.width = Math.max(4, b - a) + 'px';
  D.row.querySelector('.lrow .c-sh').textContent = fmt(ds(D.ns));
  D.row.querySelector('.lrow .c-fi').textContent = fmt(ds(D.nf));
  const tip = $('#tip');
  tip.innerHTML = `<b>${esc(D.x.equip)}</b><br>出貨日：${fmt(ds(D.ns))}<br>預計完成日：${fmt(ds(D.nf))}（${D.nf-D.ns} 天）`;
  tip.style.display = 'block'; tip.style.left = (e.clientX + 14) + 'px'; tip.style.top = (e.clientY + 18) + 'px';
});
async function endDrag(){
  const D = S.drag; S.drag = null; if (!D) return;
  $('#tip').style.display = 'none';
  if (!D.moved) return;                       // 沒有移動 = 當作點一下
  S.skipClick = true; setTimeout(() => S.skipClick = false, 50);
  if (D.ns === D.s && D.nf === D.f){ render(); return; }
  const before = {...D.x};
  const after = {...D.x, ship: ds(D.ns), finish: ds(D.nf)};
  await saveDates(before, after, true);
}
$('#gantt').addEventListener('pointerup', endDrag);
$('#gantt').addEventListener('pointercancel', endDrag);

async function saveDates(before, after, canUndo){
  Object.assign(S.items.find(i => i.id === after.id) || {}, after);
  render();
  try{
    const r = await api('update', {item: after});
    if (!r.ok) throw new Error(r.error);
    if (canUndo){
      S.undo = before;
      toast(`✅ ${esc(after.equip)}：${fmt(after.ship)} → ${fmt(after.finish)}　<button onclick="undoDrag()">復原</button>`, 6000, true);
    } else toast('↩ 已復原');
  }catch(e){
    Object.assign(S.items.find(i => i.id === after.id) || {}, before); render();
    alert('儲存失敗，已還原：' + e.message);
  }
}
function undoDrag(){ const u = S.undo; S.undo = null; if (u) saveDates({...S.items.find(i=>i.id===u.id)}, u, false); }

function loadScript(src){ return new Promise((ok,ng)=>{ const s=document.createElement('script'); s.src=src; s.onload=ok; s.onerror=ng; document.head.appendChild(s); }); }
async function exportXlsx(){
  const list = filtered(); if (!list.length) return toast('沒有資料可以匯出');
  toast('Excel 產生中…');
  try{ if (!window.ExcelJS) await loadScript('https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js'); }
  catch(e){ return alert('Excel 元件下載失敗，請確認網路'); }
  const keep = S.scale; S.scale = 'm'; const ax = makeAxis(list); S.scale = keep;
  const wb = new ExcelJS.Workbook(); wb.creator = '鴻睿自動化 生管課';
  const ws = wb.addWorksheet('甘特圖', {views:[{state:'frozen', xSplit:7, ySplit:4}]});
  const nCol = 7 + ax.cols.length;
  const logoId = wb.addImage({base64: LOGO_DATA, extension:'png'});
  ws.addImage(logoId, {tl:{col:0.1, row:0.1}, ext:{width:62, height:48}});
  ws.getRow(1).height = 26; ws.getRow(2).height = 18;
  ws.mergeCells(1,3,1,nCol); ws.getCell(1,3).value = '鴻睿自動化股份有限公司　主設備排程甘特圖';
  ws.getCell(1,3).font = {size:16, bold:true, color:{argb:'FF1F3A5F'}};
  ws.mergeCells(2,3,2,nCol); ws.getCell(2,3).value = `匯出日期：${todayStr()}　篩選：${filterText()}　共 ${list.length} 筆`;
  ws.getCell(2,3).font = {size:10, color:{argb:'FF6B7785'}};
  // 第 3 列：年、第 4 列：欄名＋月份
  const head = ['項次','工令','客戶名稱','廠別','設備名稱','出貨日','預計完成日', ...ax.cols.map(c=>(c.m+1)+'月')];
  ws.getRow(4).values = head;
  let ystart = 8;
  ax.years.forEach(y => { const n = Math.round(y.w / ax.cols[0].w); ws.mergeCells(3, ystart, 3, ystart+n-1); ws.getCell(3, ystart).value = y.label; ystart += n; });
  [3,4].forEach(r => ws.getRow(r).eachCell({includeEmpty:true}, (c,i) => { if (i<=nCol){ c.font={bold:true,color:{argb:'FFFFFFFF'}}; c.fill={type:'pattern',pattern:'solid',fgColor:{argb:'FF1F3A5F'}}; c.alignment={horizontal:'center',vertical:'middle'}; } }));
  ax.cols.forEach((c,i) => { if (c.hols.length){ const cell = ws.getCell(4, 8+i); cell.fill={type:'pattern',pattern:'solid',fgColor:{argb:'FFE67E22'}}; cell.note = c.hols.map(h=>ds(h.d)+' '+h.name).join('\n'); } });
  list.forEach((x,ri) => {
    const r = ws.getRow(5+ri);
    r.values = [x.no===''?'':Number(x.no), x.wo?(isNaN(x.wo)?x.wo:Number(x.wo)):'', x.customer, x.site, x.equip, x.ship?new Date(dn(x.ship)*DAY):'', x.finish?new Date(dn(x.finish)*DAY):''];
    r.getCell(6).numFmt = r.getCell(7).numFmt = 'yyyy/mm/dd';
    if (x.note) r.getCell(5).note = '備註：' + x.note;
    const s = dn(x.ship), f = dn(x.finish||x.ship), argb = 'FF' + (S.colorMap[x.customer]||'#2f6fb5').slice(1).toUpperCase();
    ax.cols.forEach((c,i) => {
      const cell = r.getCell(8+i);
      if (s < c.end && f >= c.start) cell.fill = {type:'pattern',pattern:'solid',fgColor:{argb}};
      cell.border = {left:{style:'hair',color:{argb:'FFDFE4EA'}}};
    });
  });
  ws.columns.forEach((c,i) => c.width = [6,9,10,8,22,12,12][i] || 5);
  ws.addRow([]);
  ws.addRow(['※ 橘色月份 = 該月有國定假日（滑鼠移到月份上可看日期）；色塊依客戶分色。']).font = {size:9,color:{argb:'FF6B7785'}};
  ws.pageSetup = {paperSize:8, orientation:'landscape', fitToPage:true, fitToWidth:1, fitToHeight:0, printTitlesRow:'3:4', margins:{left:.3,right:.3,top:.5,bottom:.5,header:.2,footer:.2}};
  ws.headerFooter.oddHeader = '&L&B鴻睿自動化股份有限公司&R主設備排程甘特圖';
  ws.headerFooter.oddFooter = '&L鴻睿自動化 內部文件・未經同意請勿外流&R第 &P / &N 頁';
  // 第二張：明細＋備註
  const ws2 = wb.addWorksheet('明細與備註');
  ws2.addRow(['項次','工令','客戶名稱','廠別','設備名稱','出貨日','預計完成日','天數','備註']);
  ws2.getRow(1).eachCell(c => { c.font={bold:true,color:{argb:'FFFFFFFF'}}; c.fill={type:'pattern',pattern:'solid',fgColor:{argb:'FF1F3A5F'}}; });
  list.forEach(x => ws2.addRow([x.no, x.wo, x.customer, x.site, x.equip, fmt(x.ship), fmt(x.finish), dn(x.finish)-dn(x.ship), x.note]));
  ws2.columns.forEach((c,i) => c.width = [6,9,10,8,24,12,12,7,40][i]);
  const buf = await wb.xlsx.writeBuffer();
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([buf],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}));
  a.download = `主設備排程甘特圖_${todayStr().replace(/-/g,'')}.xlsx`; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href), 5000);
}
